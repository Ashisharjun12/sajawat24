
services:
  valkey-queue:
    image: valkey/valkey:8-alpine
    container_name: decory-valkey-queue
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - valkey-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkey_queue_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey-cache:
    image: valkey/valkey:8-alpine
    container_name: decory-valkey-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command:
      - valkey-server
      - --save
      - ""
      - --loglevel
      - warning
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - valkey_cache_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  valkey_queue_data:
  valkey_cache_data:
